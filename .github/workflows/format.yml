name: Format

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  format:
    name: Run formatter
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run format
        run: npm run format

      - name: Commit formatted files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-format"
          commit_user_name: SamNewhouse
          commit_user_email: hello@samnewhouse.co.uk
          commit_author: SamNewhouse <hello@samnewhouse.co.uk>
          file_pattern: ":!.github/workflows/**"
