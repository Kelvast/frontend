name: Typecheck

on:
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kelvast-client

    steps:
      - name: Checkout kelvast-client
        uses: actions/checkout@v4
        with:
          path: kelvast-client

      - name: Checkout kelvast-shared
        uses: actions/checkout@v4
        with:
          repository: SamNewhouse/kelvast-shared
          path: kelvast-shared
          token: ${{ secrets.MMO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kelvast-client/package-lock.json

      - name: Install and build kelvast-shared
        working-directory: kelvast-shared
        run: npm ci && npm run build

      - name: Install client deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
